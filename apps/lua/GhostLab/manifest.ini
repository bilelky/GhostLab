[ABOUT]
NAME = GhostLab
AUTHOR = bilel
VERSION = 1.0.6
DESCRIPTION = Ghost car of any car, recorded from a replay or from your own laps, with live delta, time attack mode and an online exchange to share ghosts.
REQUIRED_VERSION = 2578

[CORE]
